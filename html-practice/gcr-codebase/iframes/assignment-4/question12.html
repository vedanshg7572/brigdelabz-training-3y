<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 12 - HTML Entities</title>
</head>
<body>

    <h1>HTML Entities Demo</h1>

    <!-- HTML entities are special codes used to display reserved or special characters -->

    <h2>Special Characters using Entities</h2>

    <!-- &lt; displays less than sign < -->
    <p>Less than sign: &lt;</p>

    <!-- &gt; displays greater than sign > -->
    <p>Greater than sign: &gt;</p>

    <!-- &amp; displays ampersand & -->
    <p>Ampersand: &amp;</p>

    <!-- &quot; displays double quote " -->
    <p>Double quote: &quot;</p>

    <!-- &apos; displays single quote ' -->
    <p>Single quote: &apos;</p>

    <h2>Symbol Entities</h2>

    <!-- &copy; displays copyright symbol -->
    <p>Copyright: &copy; 2024 Vedansh Gupta</p>

    <!-- &trade; displays trademark symbol -->
    <p>Trademark: BridgeLabz&trade;</p>

    <!-- &reg; displays registered trademark symbol -->
    <p>Registered: TechCorp&reg;</p>

</body>
</html>
