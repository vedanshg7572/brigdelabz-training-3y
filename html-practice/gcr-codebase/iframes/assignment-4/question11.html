<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 11 - Student Information Form</title>
</head>
<body>

    <h1>Student Information Form</h1>

    <form action="#" method="post">

        <label>Name:</label><br>
        <input type="text" name="name" placeholder="Enter your name" required>
        <br><br>

        <label>Roll Number:</label><br>
        <input type="text" name="rollno" placeholder="Enter your roll number" required>
        <br><br>

        <label>Select Course:</label><br>
        <!-- The first option is disabled and selected so it acts as a placeholder -->
        <select name="course" required>
            <option value="" disabled selected>Select Course</option>
            <option value="bca">BCA</option>
            <option value="btech">B.Tech</option>
            <option value="mca">MCA</option>
            <option value="mba">MBA</option>
            <option value="bsc">B.Sc Computer Science</option>
        </select>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
