<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1 - YouTube Embed</title>
</head>
<body>

    <h1>Embed YouTube Video</h1>

    <!-- This iframe embeds a YouTube video using percentage values for width and height -->
    <iframe
        width="80%"
        height="60%"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube video player"
        allowfullscreen>
    </iframe>

    <p>The width is set to 80% and height to 60% so the video adjusts when the browser is resized.</p>

</body>
</html>
