<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 8 - Feedback Form</title>
</head>
<body>

    <h1>Feedback Form</h1>

    <!-- method post sends data securely in the request body -->
    <!-- action="#" means form submits to the same page -->
    <form action="#" method="post">

        <label>Your Feedback:</label><br>
        <textarea name="feedback" rows="5" cols="50" placeholder="Write your feedback here..."></textarea>
        <br><br>

        <!-- Radio buttons for rating - only one can be selected at a time -->
        <label>Rate your experience:</label><br>
        <input type="radio" name="rating" value="good"> Good<br>
        <input type="radio" name="rating" value="average"> Average<br>
        <input type="radio" name="rating" value="poor"> Poor<br>
        <br>

        <input type="submit" value="Submit Feedback">

    </form>

</body>
</html>
