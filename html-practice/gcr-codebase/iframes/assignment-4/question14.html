<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 14 - Embedding External Website</title>
</head>
<body>

    <h1>Embedding External Website using iFrame</h1>

    <!-- This iframe tries to embed Wikipedia website -->
    <iframe
        src="https://www.wikipedia.org"
        width="800"
        height="500"
        title="Wikipedia Website">
    </iframe>

    <p>Some websites may not allow embedding for security reasons.</p>

    <!-- Many websites use X-Frame-Options or Content-Security-Policy headers to block embedding -->
    <!-- Wikipedia and Google block iframe embedding for security reasons -->

</body>
</html>
