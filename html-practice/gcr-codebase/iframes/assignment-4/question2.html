<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2 - Google Map Embed</title>
</head>
<body>

    <h1>My City - Noida on Google Maps</h1>

    <!-- loading="lazy" means the iframe will only load when the user scrolls near it -->
    <!-- This improves page loading speed especially when there are multiple iframes -->
    <iframe
        title="Noida City Map"
        width="600"
        height="450"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d224345.89!2d77.2673!3d28.5355!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x390ce5a43173357b%3A0x37ffce30c87cc03f!2sNoida%2C%20Uttar%20Pradesh!5e0!3m2!1sen!2sin"
        loading="lazy"
        allowfullscreen>
    </iframe>

    <p>This map shows Noida city in Uttar Pradesh, India.</p>

</body>
</html>
