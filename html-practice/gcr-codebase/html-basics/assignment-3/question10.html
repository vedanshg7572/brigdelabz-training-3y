<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection</title>
</head>
<body>

<h1>Travel Preference Selection</h1>

<form>

    <label>Select Country:</label><br>
    <select name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
        <option value="australia">Australia</option>
        <option value="japan">Japan</option>
    </select>
    <br><br>

    <label>Select State:</label><br>
    <select name="state">
        <option value="up" selected>Uttar Pradesh</option>
        <option value="mh">Maharashtra</option>
        <option value="goa">Goa</option>
        <option value="rj">Rajasthan</option>
        <option value="hp">Himachal Pradesh</option>
    </select>
    <br><br>

    <label>Select City:</label><br>
    <select name="city">
        <option value="noida" selected>Noida</option>
        <option value="mumbai">Mumbai</option>
        <option value="jaipur">Jaipur</option>
        <option value="manali">Manali</option>
        <option value="panaji">Panaji</option>
    </select>
    <br><br>

    <label>Select Favourite Tourist Place:</label><br>
    <select name="tourist_place">
        <option value="tajmahal" selected>Taj Mahal</option>
        <option value="hampifort">Amber Fort</option>
        <option value="gateofIndia">Gateway of India</option>
        <option value="rohtang">Rohtang Pass</option>
        <option value="baga">Baga Beach</option>
    </select>
    <br><br>

</form>

<p>I have selected India as my country. My state is Uttar Pradesh and my city is Noida. My favourite tourist place is Taj Mahal.</p>

</body>
</html>
