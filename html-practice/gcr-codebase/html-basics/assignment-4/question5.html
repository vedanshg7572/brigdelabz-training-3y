<!DOCTYPE html>
<html lang="en">
<head>
    <!-- charset UTF-8 supports almost all characters of all languages -->
    <meta charset="UTF-8">

    <!-- author meta tag tells who created this page -->
    <meta name="author" content="Vedansh Gupta">

    <!-- viewport meta tag makes the page look correct on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question 5 - Head Section and UTF-8 Encoding</title>
</head>
<body>

    <h1>UTF-8 Encoding Demo</h1>

    <p>This page shows text in three different languages to verify UTF-8 encoding works correctly.</p>

    <!-- English text -->
    <h2>English</h2>
    <p>Hello! My name is Vedansh. I am learning web development.</p>

    <!-- Hindi text -->
    <h2>Hindi</h2>
    <p>नमस्ते! मेरा नाम वेदांश है। मैं वेब डेवलपमेंट सीख रहा हूँ।</p>

    <!-- Japanese text -->
    <h2>Japanese</h2>
    <p>こんにちは！私の名前はヴェダンシュです。</p>

</body>
</html>
