<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Photo Gallery Grid</title>
    <link rel="stylesheet" href="question8.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="photo1.jpg" alt="Mountains">
            <figcaption>Mountains</figcaption>
        </figure>

        <figure>
            <img src="photo2.jpg" alt="Beach">
            <figcaption>Beach Sunset</figcaption>
        </figure>

        <figure>
            <img src="photo3.jpg" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="photo4.jpg" alt="City">
            <figcaption>City at Night</figcaption>
        </figure>

        <figure>
            <img src="photo5.jpg" alt="Desert">
            <figcaption>Sahara Desert</figcaption>
        </figure>

        <figure>
            <img src="photo6.jpg" alt="River">
            <figcaption>River View</figcaption>
        </figure>

    </div>

</body>
</html>
