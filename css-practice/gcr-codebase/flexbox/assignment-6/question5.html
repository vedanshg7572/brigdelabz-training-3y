<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Pricing Section Flexbox</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>

    <h1>Choose a Plan</h1>

    <div class="pricing-row">

        <div class="plan">
            <h2>Basic</h2>
            <p class="price">Rs. 299/mo</p>
            <ul>
                <li>5 Projects</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>
            <a href="#" class="btn">Get Basic</a>
        </div>

        <div class="plan popular">
            <h2>Standard ⭐</h2>
            <p class="price">Rs. 799/mo</p>
            <ul>
                <li>20 Projects</li>
                <li>50 GB Storage</li>
                <li>Priority Support</li>
                <li>Analytics</li>
            </ul>
            <a href="#" class="btn">Get Standard</a>
        </div>

        <div class="plan">
            <h2>Premium</h2>
            <p class="price">Rs. 1499/mo</p>
            <ul>
                <li>Unlimited Projects</li>
                <li>200 GB Storage</li>
                <li>24/7 Support</li>
            </ul>
            <a href="#" class="btn">Get Premium</a>
        </div>

    </div>

</body>
</html>
