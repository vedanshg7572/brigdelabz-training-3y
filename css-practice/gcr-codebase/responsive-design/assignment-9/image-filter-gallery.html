<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Image Filter Gallery</title>
    <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>

    <h1>Image Filter Gallery</h1>
    <p class="subtitle">Hover over each image to remove the filter effect</p>

    <div class="gallery">

        <figure>
            <img src="photo1.jpg" alt="Blur Effect" class="blur-img">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure>
            <img src="photo2.jpg" alt="Grayscale Effect" class="grayscale-img">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure>
            <img src="photo3.jpg" alt="Sepia Effect" class="sepia-img">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure>
            <img src="photo4.jpg" alt="Brightness Effect" class="brightness-img">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure>
            <img src="photo5.jpg" alt="Contrast Effect" class="contrast-img">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure>
            <img src="photo6.jpg" alt="Hue Rotate Effect" class="hue-img">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>

    </div>

</body>
</html>
