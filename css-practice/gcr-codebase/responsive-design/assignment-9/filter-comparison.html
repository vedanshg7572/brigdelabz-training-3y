<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Filter Comparison</title>
    <link rel="stylesheet" href="filter-comparison.css">
</head>
<body>

    <h1>Filter Before and After Comparison</h1>
    <p class="subtitle">Hover over the filtered image to see the original</p>

    <div class="comparison-row">

        <figure class="img-block">
            <img src="photo1.jpg" alt="Original Image" class="original-img">
            <figcaption>Original Image (No Filter)</figcaption>
        </figure>

        <figure class="img-block">
            <img src="photo1.jpg" alt="Filtered Image" class="filtered-img">
            <figcaption>Filtered Image (Hover to Remove Filter)</figcaption>
        </figure>

    </div>

    <div class="comparison-row second-row">

        <figure class="img-block">
            <img src="photo2.jpg" alt="Original" class="original-img">
            <figcaption>Original Image</figcaption>
        </figure>

        <figure class="img-block">
            <img src="photo2.jpg" alt="Filtered" class="filtered-img brightness-filter">
            <figcaption>Brightness Filter Applied</figcaption>
        </figure>

    </div>

</body>
</html>
