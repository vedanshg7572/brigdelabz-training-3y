<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Image Showcase</title>
    <link rel="stylesheet" href="question3.css">
</head>
<body>

    <h1>Image Showcase</h1>

    <div class="gallery">

        <figure class="img-card">
            <div class="img-wrap">
                <img src="photo1.jpg" alt="Mountains">
                <div class="overlay"></div>
            </div>
            <figcaption>Mountains</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="photo2.jpg" alt="Beach">
                <div class="overlay"></div>
            </div>
            <figcaption>Goa Beach</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="photo3.jpg" alt="Forest">
                <div class="overlay"></div>
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="photo4.jpg" alt="Desert">
                <div class="overlay"></div>
            </div>
            <figcaption>Rajasthan Desert</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="photo5.jpg" alt="City">
                <div class="overlay"></div>
            </div>
            <figcaption>Mumbai City</figcaption>
        </figure>

        <figure class="img-card">
            <div class="img-wrap">
                <img src="photo6.jpg" alt="Sunset">
                <div class="overlay"></div>
            </div>
            <figcaption>Sunset View</figcaption>
        </figure>

    </div>

</body>
</html>
