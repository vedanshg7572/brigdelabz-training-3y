<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Tooltip Demo</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>

    <h1>CSS Tooltip Demo</h1>
    <p class="subtitle">Hover over the words below to see tooltips</p>

    <div class="tooltip-row">

        <div class="tooltip-wrap">
            <span class="trigger">HTML</span>
            <div class="tooltip">HyperText Markup Language</div>
        </div>

        <div class="tooltip-wrap">
            <span class="trigger">CSS</span>
            <div class="tooltip">Cascading Style Sheets</div>
        </div>

        <div class="tooltip-wrap">
            <span class="trigger">JavaScript</span>
            <div class="tooltip">Programming language of the web</div>
        </div>

        <div class="tooltip-wrap">
            <span class="trigger">Git</span>
            <div class="tooltip">Version control system</div>
        </div>

        <div class="tooltip-wrap">
            <span class="trigger">GitHub</span>
            <div class="tooltip">Cloud platform to host Git repos</div>
        </div>

    </div>

</body>
</html>
