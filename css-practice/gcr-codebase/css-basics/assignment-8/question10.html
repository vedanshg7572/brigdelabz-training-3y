<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q10 - Mini UI Layout</title>
    <link rel="stylesheet" href="question10.css">
</head>
<body>

    <header>
        <div class="logo">VedanshDev</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <div class="main-card">

            <img src="profile.jpg" alt="Vedansh" class="card-img">

            <h2>Hello, I am Vedansh!</h2>
            <p>This is a simple mini UI layout that combines forms, buttons, and images together. Everything is styled using only HTML and CSS.</p>

            <form action="#" method="post">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="3" placeholder="Your Message" required></textarea>
                <div class="form-btns">
                    <button type="submit" class="btn submit-btn">Send</button>
                    <button type="reset" class="btn reset-btn">Reset</button>
                </div>
            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2024 Vedansh Gupta. All rights reserved.</p>
    </footer>

</body>
</html>
