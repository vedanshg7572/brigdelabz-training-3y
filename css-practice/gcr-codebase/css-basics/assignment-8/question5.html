<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Button Collection</title>
    <link rel="stylesheet" href="question5.css">
</head>
<body>

    <h1>Styled Button Collection</h1>

    <div class="btn-row">
        <button class="btn primary-btn">Primary Button</button>
        <button class="btn secondary-btn">Secondary Button</button>
        <button class="btn outline-btn">Outline Button</button>
        <button class="btn danger-btn">Danger Button</button>
        <button class="btn" disabled>Disabled Button</button>
    </div>

    <div class="btn-row">
        <button class="btn large-btn">Large Button</button>
        <button class="btn small-btn">Small</button>
        <button class="btn rounded-btn">Rounded</button>
        <button class="btn shadow-btn">Shadow Button</button>
    </div>

</body>
</html>
