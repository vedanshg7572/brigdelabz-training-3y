<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS Animations</title>
    <link rel="stylesheet" href="question6.css">
</head>
<body>

    <h1>CSS Animation Demo</h1>

    <div class="animation-area">

        <div class="anim-block">
            <div class="moving-box"></div>
            <p>Moving Box</p>
        </div>

        <div class="anim-block">
            <div class="bouncing-ball"></div>
            <p>Bouncing Ball</p>
        </div>

        <div class="anim-block">
            <h2 class="color-text">Color Changing Text</h2>
            <p>Color-shift Text</p>
        </div>

        <div class="anim-block">
            <div class="spinning-box"></div>
            <p>Spinning Box</p>
        </div>

    </div>

</body>
</html>
