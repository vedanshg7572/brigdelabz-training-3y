</head>
<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <div class="gallery-item">
            <img src="photo1.jpg" alt="Mountains">
            <div class="caption">Mountains</div>
        </div>

        <div class="gallery-item">
            <img src="photo2.jpg" alt="Beach">
            <div class="caption">Beach</div>
        </div>

        <div class="gallery-item">
            <img src="photo3.jpg" alt="Forest">
            <div class="caption">Forest</div>
        </div>

        <div class="gallery-item">
            <img src="photo4.jpg" alt="City">
            <div class="caption">City</div>
        </div>

        <div class="gallery-item">
            <img src="photo5.jpg" alt="Desert">
            <div class="caption">Desert</div>
        </div>

        <div class="gallery-item">
            <img src="photo6.jpg" alt="Sunset">
            <div class="caption">Sunset</div>
        </div>

    </div>
