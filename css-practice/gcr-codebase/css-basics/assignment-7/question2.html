<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Height and Width</title>
    <link rel="stylesheet" href="question2.css">
</head>
<body>

    <h1>Height and Width Demo</h1>

    <div class="wrapper">

        <div class="box box1">
            <p>Box 1</p>
            <p>width: 200px</p>
            <p>height: 150px</p>
        </div>

        <div class="box box2">
            <p>Box 2</p>
            <p>width: 40%</p>
            <p>height: 30vh</p>
            <p>max-width: 400px</p>
        </div>

        <div class="box box3">
            <p>Box 3</p>
            <p>width: 15em</p>
            <p>min-height: 200px</p>
            <p>overflow: hidden</p>
            <p>Extra text that gets cut off because overflow is hidden and the box has a fixed height so this text will not show fully.</p>
        </div>

    </div>

</body>
</html>
