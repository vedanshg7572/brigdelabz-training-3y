<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Outline and Focus Form</title>
    <link rel="stylesheet" href="question9.css">
</head>
<body>

    <div class="form-container">

        <h1>Contact Form</h1>
        <p>Click on any field to see the outline focus effect</p>

        <form action="#" method="post">

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message..."></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</body>
</html>
