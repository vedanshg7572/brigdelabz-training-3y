<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS Transformations</title>
    <link rel="stylesheet" href="question6.css">
</head>
<body>

    <h1>CSS Transformations Demo</h1>
    <p class="subtitle">Hover over each box to see the transformation</p>

    <div class="transform-row">

        <div class="transform-box rotate-box">
            <span>Hover me!</span>
            <p>rotate(45deg)</p>
        </div>

        <div class="transform-box scale-box">
            <span>Hover me!</span>
            <p>scale(1.4)</p>
        </div>

        <div class="transform-box translate-box">
            <span>Hover me!</span>
            <p>translate(20px, -20px)</p>
        </div>

        <div class="transform-box skew-box">
            <span>Hover me!</span>
            <p>skew(15deg)</p>
        </div>

    </div>

</body>
</html>
