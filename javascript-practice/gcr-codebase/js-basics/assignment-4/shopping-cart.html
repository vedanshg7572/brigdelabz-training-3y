<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Shopping Cart</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 40px; background: #f4f4f4; }
        .container { width: 450px; }
        h2 { text-align: center; color: #e67e22; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.95rem; }
        th { background: #f39c12; color: white; }
        .coupon-row { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { padding: 10px 18px; background: #e67e22; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #ca6f1e; }
        .total-box { background: #fef9f0; border: 2px solid #f39c12; padding: 15px; border-radius: 8px; }
        .err { color: red; font-size: 0.85rem; margin-top: 5px; }
        .ok  { color: green; font-size: 0.85rem; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <h2>🛒 Shopping Cart</h2>

    <div class="box">
        <table>
            <thead>
                <tr><th>Item</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr>
            </thead>
            <tbody id="cartTable"></tbody>
        </table>

        <div class="coupon-row">
            <input type="text" id="couponInput" placeholder="Enter coupon (e.g. SAVE20)">
            <button onclick="applyCoupon()">Apply</button>
        </div>
        <p id="couponMsg"></p>
    </div>

    <div class="box total-box">
        <p>Cart Total: <strong id="cartTotal">Rs. 0</strong></p>
        <p>Discount:   <strong id="discountAmt">Rs. 0</strong></p>
        <p style="font-size:1.1rem;">Final Total: <strong id="finalTotal">Rs. 0</strong></p>
    </div>
</div>
<script src="shopping-cart.js"></script>
</body>
</html>
