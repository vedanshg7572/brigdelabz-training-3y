<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q7 - Login Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 35px; border-radius: 12px; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        h2 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
        .field { margin-bottom: 18px; display: flex; flex-direction: column; }
        label { font-size: 0.9rem; color: #555; margin-bottom: 5px; }
        input { padding: 10px; border: 2px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input.valid { border-color: #2ecc71; }
        input.invalid { border-color: #e74c3c; }
        .err { color: #e74c3c; font-size: 0.8rem; margin-top: 4px; min-height: 16px; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1a252f; }
        .success { color: #27ae60; font-weight: bold; text-align: center; margin-top: 14px; display: none; }
    </style>
</head>
<body>
<div class="box">
    <h2>Login</h2>

    <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="At least 5 characters">
        <span class="err" id="userErr"></span>
    </div>

    <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="Strong password">
        <span class="err" id="passErr"></span>
    </div>

    <button onclick="loginValidate()">Login</button>
    <p class="success" id="successMsg">Login Successful! Welcome back.</p>
</div>
<script src="login-form.js"></script>
</body>
</html>
