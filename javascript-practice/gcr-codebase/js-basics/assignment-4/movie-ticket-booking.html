<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q5 - Movie Ticket Booking</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 40px; background: #1a1a2e; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 420px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #e74c3c; margin-bottom: 20px; }
        .field { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.9rem; color: #555; margin-bottom: 5px; }
        input { padding: 10px; border: 2px solid #ccc; border-radius: 6px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input.valid { border-color: #2ecc71; }
        input.invalid { border-color: #e74c3c; }
        .err { color: #e74c3c; font-size: 0.8rem; margin-top: 3px; }
        button { width: 100%; padding: 12px; background: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #c0392b; }
        .ticket { margin-top: 20px; background: #fdf3f3; border: 2px dashed #e74c3c; border-radius: 10px; padding: 20px; display: none; }
        .ticket h3 { color: #e74c3c; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="box">
    <h2>🎬 Movie Ticket Booking</h2>

    <div class="field">
        <label>Your Name</label>
        <input type="text" id="bName" placeholder="Full name">
        <span class="err" id="nameErr"></span>
    </div>

    <div class="field">
        <label>Email</label>
        <input type="text" id="bEmail" placeholder="email@example.com">
        <span class="err" id="emailErr"></span>
    </div>

    <div class="field">
        <label>Number of Seats (1–10)</label>
        <input type="number" id="bSeats" placeholder="How many seats?" min="1" max="10">
        <span class="err" id="seatsErr"></span>
    </div>

    <button onclick="bookTicket()">Book Now</button>

    <div class="ticket" id="ticketBox">
        <h3>🎟️ Booking Confirmed!</h3>
        <p id="ticketInfo"></p>
    </div>
</div>
<script src="movie-ticket-booking.js"></script>
</body>
</html>
