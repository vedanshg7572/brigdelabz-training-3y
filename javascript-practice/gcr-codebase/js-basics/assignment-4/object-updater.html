<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - Dynamic Object Updater</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 40px; background: #f4f6f8; }
        .container { width: 420px; }
        h2 { color: #2c3e50; text-align: center; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .field { margin-bottom: 14px; display: flex; flex-direction: column; }
        label { font-size: 0.9rem; color: #555; margin-bottom: 4px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 11px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #219a52; }
        pre { background: #eafaf1; border: 1px solid #2ecc71; padding: 15px; border-radius: 8px; font-size: 0.95rem; }
        h3 { color: #27ae60; }
    </style>
</head>
<body>
<div class="container">
    <h2>Dynamic Object Updater</h2>

    <div class="box">
        <div class="field">
            <label>Name</label>
            <input type="text" id="uName" value="John">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="text" id="uEmail" value="john@mail.com">
        </div>
        <div class="field">
            <label>Age</label>
            <input type="number" id="uAge" value="21">
        </div>
        <button onclick="updateUser()">Update User</button>
    </div>

    <div class="box">
        <h3>Updated User Object</h3>
        <pre id="userDisplay"></pre>
    </div>
</div>
<script src="object-updater.js"></script>
</body>
</html>
