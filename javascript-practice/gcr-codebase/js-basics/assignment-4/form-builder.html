<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q4 - Custom Form Builder</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 40px; background: #f4f4f4; }
        .form-box { background: white; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        .field { margin-bottom: 16px; display: flex; flex-direction: column; }
        label { font-size: 0.9rem; color: #555; margin-bottom: 5px; }
        input, select, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2980b9; }
        pre { background: #f0f0f0; padding: 15px; border-radius: 6px; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Dynamic Form</h2>
    <div id="formContainer"></div>
    <button onclick="submitForm()">Submit</button>
    <pre id="output"></pre>
</div>

<script src="form-builder.js"></script>
</body>
</html>
