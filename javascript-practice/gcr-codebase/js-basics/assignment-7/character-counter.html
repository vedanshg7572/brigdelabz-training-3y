<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Character Counter</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 12px; width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 15px; color: #2c3e50; }
        textarea { width: 100%; height: 130px; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem; resize: none; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .counter { text-align: right; font-size: 1rem; margin-top: 8px; font-weight: bold; color: #27ae60; transition: color 0.3s; }
        .counter.warning { color: #f39c12; }
        .counter.danger  { color: #e74c3c; }
        button { margin-top: 14px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Live Character Counter</h2>
        <textarea id="textArea" placeholder="Start typing... (max 100 characters)"></textarea>
        <div class="counter" id="counter">100 characters remaining</div>
        <button onclick="resetAll()">Reset</button>
    </div>
    <script src="character-counter.js"></script>
</body>
</html>
