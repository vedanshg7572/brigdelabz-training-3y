<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q8 - Custom Dropdown</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; }
        .dropdown { position: relative; width: 240px; }
        .dropdown-btn { width: 100%; padding: 12px 16px; background: white; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .dropdown-btn:hover { border-color: #3498db; }
        .dropdown-btn.open { border-color: #3498db; border-radius: 8px 8px 0 0; }
        .dropdown-list { display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid #3498db; border-top: none; border-radius: 0 0 8px 8px; list-style: none; margin: 0; padding: 0; z-index: 10; }
        .dropdown-list.open { display: block; }
        .dropdown-list li { padding: 11px 16px; cursor: pointer; transition: background 0.15s; }
        .dropdown-list li:hover { background: #eaf4fb; }
    </style>
</head>
<body>
    <div class="dropdown" id="dropdown">
        <button class="dropdown-btn" id="dropBtn">
            <span id="dropLabel">Select a language</span>
            <span>&#9660;</span>
        </button>
        <ul class="dropdown-list" id="dropList">
            <li>JavaScript</li>
            <li>Python</li>
            <li>Java</li>
            <li>C++</li>
            <li>TypeScript</li>
        </ul>
    </div>
    <script src="custom-dropdown.js"></script>
</body>
</html>
