<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q4 - Theme Switcher</title>
    <style>
        body { font-family: Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background 0.4s, color 0.4s; }
        body[data-theme="light"] { background: #f9f9f9; color: #222; }
        body[data-theme="dark"]  { background: #1e1e2f; color: #f0f0f0; }
        body[data-theme="blue"]  { background: #1a3c5e; color: #cce5ff; }
        h1 { font-size: 2rem; margin-bottom: 30px; }
        .btn-row { display: flex; gap: 15px; }
        button { padding: 12px 28px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
        .btn-light { background: #ecf0f1; color: #333; }
        .btn-dark  { background: #2c3e50; color: white; }
        .btn-blue  { background: #2980b9; color: white; }
        .info { margin-top: 25px; font-size: 0.95rem; opacity: 0.75; }
    </style>
</head>
<body data-theme="light">
    <h1>Theme Switcher</h1>
    <div class="btn-row">
        <button class="btn-light" onclick="setTheme('light')">Light</button>
        <button class="btn-dark"  onclick="setTheme('dark')">Dark</button>
        <button class="btn-blue"  onclick="setTheme('blue')">Blue</button>
    </div>
    <p class="info" id="themeInfo">Current theme: light</p>
    <script src="theme-switcher.js"></script>
</body>
</html>
