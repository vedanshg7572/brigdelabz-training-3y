<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Form Submit Blocker</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        .form-box { background: white; padding: 35px; border-radius: 12px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 0.9rem; color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 11px; border: 2px solid #ccc; border-radius: 7px; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3498db; }
        input.invalid { border-color: #e74c3c; }
        input.valid   { border-color: #2ecc71; }
        .err { color: #e74c3c; font-size: 0.82rem; margin-top: 5px; min-height: 16px; }
        button[type="submit"] { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 7px; font-size: 1rem; cursor: pointer; margin-top: 5px; }
        button[type="submit"]:hover { background: #27ae60; }
        .success { display: none; margin-top: 18px; background: #eafaf1; border: 2px solid #2ecc71; border-radius: 8px; padding: 14px; text-align: center; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Register</h2>
        <form id="myForm" novalidate>

            <div class="field">
                <label>Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <div class="err" id="nameErr"></div>
            </div>

            <div class="field">
                <label>Email</label>
                <input type="text" id="email" placeholder="Enter your email">
                <div class="err" id="emailErr"></div>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters">
                <div class="err" id="passErr"></div>
            </div>

            <button type="submit">Submit</button>
        </form>
        <div class="success" id="successMsg">Form Submitted Successfully!</div>
    </div>
    <script src="form-submit-blocker.js"></script>
</body>
</html>
