<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q3 - Multi Step Form</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; margin: 0; }
        .form-box { background: white; padding: 35px; border-radius: 12px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .step-label { text-align: center; color: #7f8c8d; font-size: 0.9rem; margin-bottom: 25px; }
        .step { display: none; }
        .step.active { display: block; }
        label { display: block; margin-bottom: 6px; font-size: 0.95rem; color: #555; }
        input { width: 100%; padding: 11px; border: 2px solid #ccc; border-radius: 7px; font-size: 1rem; box-sizing: border-box; outline: none; }
        input.invalid { border-color: #e74c3c; }
        .err { color: #e74c3c; font-size: 0.82rem; margin-top: 5px; min-height: 16px; }
        .btn-row { display: flex; gap: 10px; margin-top: 22px; }
        button { flex: 1; padding: 11px; border: none; border-radius: 7px; font-size: 1rem; cursor: pointer; }
        .btn-next { background: #2ecc71; color: white; }
        .btn-back { background: #bdc3c7; color: #333; }
        .btn-next:hover { background: #27ae60; }
        .btn-back:hover { background: #95a5a6; }
        .summary { background: #eafaf1; border: 2px solid #2ecc71; border-radius: 8px; padding: 20px; display: none; }
        .summary h3 { color: #27ae60; margin-top: 0; }
        .summary p { margin: 6px 0; }
        .progress { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; transition: background 0.3s; }
        .dot.active { background: #2ecc71; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Registration</h2>
        <div class="progress">
            <div class="dot active" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
        </div>

        <div class="step active" id="step1">
            <div class="step-label">Step 1 of 3 — Your Name</div>
            <label>Full Name</label>
            <input type="text" id="fname" placeholder="Enter your full name">
            <div class="err" id="fnameErr"></div>
            <div class="btn-row">
                <button class="btn-next" onclick="goNext(1)">Next →</button>
            </div>
        </div>

        <div class="step" id="step2">
            <div class="step-label">Step 2 of 3 — Email</div>
            <label>Email Address</label>
            <input type="text" id="femail" placeholder="Enter your email">
            <div class="err" id="femailErr"></div>
            <div class="btn-row">
                <button class="btn-back" onclick="goBack(2)">← Back</button>
                <button class="btn-next" onclick="goNext(2)">Next →</button>
            </div>
        </div>

        <div class="step" id="step3">
            <div class="step-label">Step 3 of 3 — Password</div>
            <label>Password</label>
            <input type="password" id="fpass" placeholder="Min 6 characters">
            <div class="err" id="fpassErr"></div>
            <div class="btn-row">
                <button class="btn-back" onclick="goBack(3)">← Back</button>
                <button class="btn-next" onclick="goNext(3)">Submit</button>
            </div>
        </div>

        <div class="summary" id="summary">
            <h3>Registration Complete!</h3>
            <p><strong>Name:</strong> <span id="sName"></span></p>
            <p><strong>Email:</strong> <span id="sEmail"></span></p>
            <p><strong>Password:</strong> ••••••</p>
        </div>
    </div>
    <script src="multi-step-form.js"></script>
</body>
</html>
