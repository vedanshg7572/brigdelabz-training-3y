<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q1 - Product List Manager</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
        h2 { color: #2c3e50; }
        .add-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .add-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        .add-row button { padding: 10px 18px; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .add-row button:hover { background: #219a52; }
        ul { list-style: none; padding: 0; }
        li { background: white; padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        li span { flex: 1; font-size: 1rem; }
        li input { flex: 1; padding: 5px 8px; border: 1px solid #3498db; border-radius: 4px; font-size: 1rem; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-left: 8px; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; margin-left: 6px; }
        .btn-edit:hover { background: #2980b9; }
        .btn-delete:hover { background: #c0392b; }
    </style>
</head>
<body>
    <h2>Product List Manager</h2>
    <div class="add-row">
        <input type="text" id="productInput" placeholder="Enter product name...">
        <button onclick="addProduct()">Add</button>
    </div>
    <ul id="productList"></ul>
    <script src="product-list-manager.js"></script>
</body>
</html>
