<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q6 - Table Filter</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { color: #2c3e50; }
        input[type="text"] { width: 100%; padding: 11px 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 20px; outline: none; }
        input:focus { border-color: #3498db; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,0,0,0.08); }
        th { background: #2c3e50; color: white; padding: 13px 15px; text-align: left; }
        td { padding: 12px 15px; border-bottom: 1px solid #eee; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f9f9f9; }
        #noResult { display: none; text-align: center; color: #e74c3c; padding: 20px; font-size: 1rem; background: white; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Table Filter</h2>
        <input type="text" id="searchBox" placeholder="Search by name, branch or CGPA...">
        <table>
            <thead>
                <tr><th>Name</th><th>Branch</th><th>CGPA</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td>Vedansh Gupta</td><td>Computer Science</td><td>8.9</td></tr>
                <tr><td>Priya Sharma</td><td>Electronics</td><td>7.5</td></tr>
                <tr><td>Rohit Verma</td><td>Mechanical</td><td>6.8</td></tr>
                <tr><td>Sneha Patel</td><td>Civil</td><td>9.1</td></tr>
                <tr><td>Arjun Singh</td><td>Computer Science</td><td>8.2</td></tr>
                <tr><td>Kavya Nair</td><td>Electronics</td><td>7.9</td></tr>
            </tbody>
        </table>
        <div id="noResult">No results found</div>
    </div>
    <script src="table-filter.js"></script>
</body>
</html>
