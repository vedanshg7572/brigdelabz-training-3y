<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q6 - Product Fetcher</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 30px; background: #f4f4f4; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 3px 12px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 120px; height: 120px; object-fit: contain; margin-bottom: 10px; }
        .card h3 { font-size: 0.85rem; color: #333; margin-bottom: 8px; height: 40px; overflow: hidden; }
        .card .price { font-size: 1.1rem; font-weight: bold; color: #27ae60; }
        #errorMsg { text-align: center; color: red; font-size: 1.1rem; display: none; }
    </style>
</head>
<body>
    <h1>Product Catalog</h1>
    <p id="errorMsg">Failed to load products. Please try again.</p>
    <div class="grid" id="productGrid"></div>

    <script src="product-fetcher.js"></script>
</body>
</html>
