<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 - Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>
<body class="bg-light">

    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">ShopEasy</h1>
            <span class="badge bg-primary">8 Products</span>
        </div>
    </header>

    <main class="container py-5">
        <h2 class="text-center mb-4">Our Products</h2>

        <!-- row with col-md-3 gives 4 columns on desktop, col-sm-6 gives 2 on tablet -->
        <div class="row g-4">

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product1.jpg" class="card-img-top" alt="Headphones">
                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="text-danger fw-bold">Rs. 2,499</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product2.jpg" class="card-img-top" alt="Keyboard">
                    <div class="card-body text-center">
                        <h5 class="card-title">Mechanical Keyboard</h5>
                        <p class="text-danger fw-bold">Rs. 3,999</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product3.jpg" class="card-img-top" alt="Mouse">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gaming Mouse</h5>
                        <p class="text-danger fw-bold">Rs. 1,799</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product4.jpg" class="card-img-top" alt="Webcam">
                    <div class="card-body text-center">
                        <h5 class="card-title">HD Webcam</h5>
                        <p class="text-danger fw-bold">Rs. 2,199</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product5.jpg" class="card-img-top" alt="USB Hub">
                    <div class="card-body text-center">
                        <h5 class="card-title">USB-C Hub</h5>
                        <p class="text-danger fw-bold">Rs. 1,299</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product6.jpg" class="card-img-top" alt="Monitor">
                    <div class="card-body text-center">
                        <h5 class="card-title">24" Monitor</h5>
                        <p class="text-danger fw-bold">Rs. 12,999</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product7.jpg" class="card-img-top" alt="SSD">
                    <div class="card-body text-center">
                        <h5 class="card-title">Portable SSD 1TB</h5>
                        <p class="text-danger fw-bold">Rs. 5,499</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-md-3 col-sm-6">
                <div class="card h-100 shadow-sm product-card">
                    <img src="product8.jpg" class="card-img-top" alt="Stand">
                    <div class="card-body text-center">
                        <h5 class="card-title">Laptop Stand</h5>
                        <p class="text-danger fw-bold">Rs. 899</p>
                        <button class="btn btn-primary btn-sm w-100">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-4">
        <p class="mb-0">&copy; 2024 ShopEasy. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
